<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>وصلة شحن – التسجيل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1220}
a{color:#22D3EE}a:hover{color:#67E8F9}
button,input{font-family:inherit}
button{cursor:pointer}
@keyframes wleft{0%{translate:-26px 0;opacity:0}100%{translate:0 0;opacity:1}}
@keyframes wright{0%{translate:26px 0;opacity:0}100%{translate:0 0;opacity:1}}
@keyframes wbolt{0%{stroke-dashoffset:40}100%{stroke-dashoffset:0}}
@keyframes wglow{0%,100%{opacity:.0}50%{opacity:.35}}
@keyframes wrise{0%{translate:0 16px;opacity:0}100%{translate:0 0;opacity:1}}
.w-left{animation:wleft .6s cubic-bezier(.2,.8,.2,1) .1s both}
.w-right{animation:wright .6s cubic-bezier(.2,.8,.2,1) .1s both}
.w-bolt{stroke-dasharray:40;animation:wbolt .5s ease-out .65s both}
.w-glow{animation:wglow 2.6s ease-in-out 1.2s infinite}
.w-rise{animation:wrise .5s ease-out both}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #0A111F; color: #E8EEF8; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; padding: 56px 24px 28px; display: flex; flex-direction: column; gap: 28px">

  <div style="position: relative; width: 140px; height: 140px; align-self: center">
    <div class="w-glow" aria-hidden="true" style="position: absolute; inset: 10px; border-radius: 60px; background: #22D3EE; filter: blur(30px)"></div>
    <svg width="140" height="140" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="لوجو وصلة شحن" style="position: relative">
      <path class="w-left" d="M24 18h-6a14 14 0 0 0 0 28h6" stroke="#E8EEF8" stroke-width="5"></path>
      <path class="w-right" d="M40 18h6a14 14 0 0 1 0 28h-6" stroke="#E8EEF8" stroke-width="5"></path>
      <path class="w-bolt" d="M35 20L27 33h10l-8 12" stroke="#22D3EE" stroke-width="5"></path>
    </svg>
  </div>

  <div class="w-rise" style="display: flex; flex-direction: column; gap: 8px; animation-delay: .9s">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; line-height: 1.2">اعرف الشاحن<br><span style="color: #22D3EE">شغّال</span> قبل ما تروح.</h1>
    <span style="font-size: 15px; color: #9AA8C0; line-height: 1.7">كل الشبكات على خريطة واحدة، وحالة كل شاحن جاية من سواقين زيك.</span>
  </div>

  <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ true }}">
    <div class="w-rise" style="display: flex; flex-direction: column; gap: 10px; animation-delay: 1s">
      <label for="phone" style="font-size: 13px; color: #9AA8C0">رقم موبايلك</label>
      <div dir="ltr" style="display: flex; align-items: center; height: 60px; border-radius: 18px; background: #121A2B; padding: 0 6px 0 18px; gap: 12px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: #7F8DA8">+20</span>
        <span aria-hidden="true" style="width: 1px; height: 26px; background: #26324A"></span>
        <input id="phone" inputmode="tel" value="10 1234 5678" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #E8EEF8; font-family: 'Space Grotesk', sans-serif; font-size: 20px; letter-spacing: 1px; outline: none">
      </div>
      <button onClick="{{ next }}" style="height: 56px; border-radius: 18px; background: #22D3EE; color: #06202A; border: 0; font-size: 17px; font-weight: 700">ابعتلي الكود</button>
    </div>
  </sc-if>

  <sc-if value="{{ isOtp }}" hint-placeholder-val="{{ false }}">
    <div class="w-rise" style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 13px; color: #9AA8C0">اكتب الكود اللي وصلك على 01012345678</span>
      <div dir="ltr" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <span style="height: 60px; border-radius: 16px; background: #121A2B; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">4</span>
        <span style="height: 60px; border-radius: 16px; background: #121A2B; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">8</span>
        <span style="height: 60px; border-radius: 16px; background: #121A2B; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">2</span>
        <span style="height: 60px; border-radius: 16px; background: #121A2B; box-shadow: inset 0 0 0 2px #22D3EE"></span>
        <span style="height: 60px; border-radius: 16px; background: #121A2B"></span>
        <span style="height: 60px; border-radius: 16px; background: #121A2B"></span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px"><button onClick="{{ back }}" style="background: transparent; border: 0; color: #22D3EE; font-size: 13px; min-height: 44px">غيّر الرقم</button><span dir="ltr" style="color: #7F8DA8; font-family: 'Space Grotesk', sans-serif; align-self: center">0:42</span></div>
      <a href="Main.dc.html" style="height: 56px; border-radius: 18px; background: #22D3EE; color: #06202A; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-decoration: none">تأكيد</a>
    </div>
  </sc-if>

  <a href="Main.dc.html" style="align-self: center; font-size: 14px; text-decoration: none; min-height: 44px; display: flex; align-items: center">تصفح الخريطة من غير حساب ←</a>

  <span style="margin-top: auto; font-size: 12px; color: #7F8DA8; text-align: center; line-height: 1.7">الحساب محتاجه بس علشان تبلّغ أو تضيف محطة · <a href="#">الشروط</a> · <a href="#">الخصوصية</a></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 'phone' }; }
  renderVals() {
    return {
      isPhone: this.state.step === 'phone', isOtp: this.state.step === 'otp',
      next: () => this.setState({ step: 'otp' }), back: () => this.setState({ step: 'phone' })
    };
  }
}
</script>
</body>
</html>
